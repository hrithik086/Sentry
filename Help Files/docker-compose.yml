# docker run -p 127.0.0.1:8080:8080 -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin quay.io/keycloak/keycloak:26.5.6 start-dev
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.6
    container_name: keycloak
    ports:
      - 8080:8080
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    command: ["start-dev"]
    # here in the below code we asking docker to mount keycload-data drive in the specified path
    volumes:
      - keycloak-data:/opt/keycloak/data
  
  mongodb:
    image: mongodb/mongodb-community-server
    container_name: mongodb-container
    ports:
      - 27017:27017
    volumes:
      - mongodb-data:/data/db

  postgresdb:
    image: postgres:latest
    container_name: postgres-container
    # restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgresdb-data:/var/lib/postgresql


# Here the below command create a kind of virtual volume drive managed by docker.
# this volume will be used by docker to store useful data, so that whenever we are re-running our container it will get the old saved data
volumes:
  keycloak-data:
  mongodb-data:
  postgresdb-data: